<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#415d56"/></marker></defs><rect width="1000" height="420" fill="#ffffff"/><g font-family="Arial,sans-serif" fill="#233b35"><text x="20" y="28" font-size="20">NoteVault - data flows and trust boundaries</text><g stroke="#9aac9d" fill="#f4f7f2" stroke-dasharray="6 4"><rect x="20" y="55" width="230" height="190" rx="12"/><rect x="365" y="55" width="270" height="190" rx="12"/><rect x="750" y="55" width="230" height="190" rx="12"/><rect x="20" y="295" width="615" height="105" rx="12"/></g><g font-size="14"><text x="38" y="82">TB1 - browser</text><text x="383" y="82">TB2 - app container</text><text x="768" y="82">TB3 - storage</text><text x="38" y="322">TB4 - build and supply chain</text></g><g font-size="17" text-anchor="middle"><text x="135" y="135">User / administrator</text><text x="135" y="164">React interface</text><text x="500" y="135">Flask API</text><text x="500" y="164">Authorization / export</text><text x="865" y="132">SQLite</text><text x="865" y="161">Notes / accounts</text><text x="865" y="190">Sessions / audit</text></g><g fill="none" stroke="#415d56" stroke-width="2" marker-end="url(#arrow)"><path d="M250 120 H365"/><path d="M365 202 H250"/><path d="M635 120 H750"/><path d="M750 202 H635"/><path d="M500 295 V245"/></g><g font-size="12" text-anchor="middle"><text x="307" y="106">JSON + cookie</text><text x="307" y="145">+ CSRF</text><text x="307" y="226">Owned export</text><text x="693" y="106">Bound SQL</text><text x="693" y="226">Owned records</text><text x="564" y="275">Verified build</text></g><text x="40" y="357" font-size="15">Source + locks → Security CI → SBOM + signed release</text><text x="40" y="382" font-size="12">Local key signature proves integrity, not independent provenance.</text></g></svg>