name: team-outsiders
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      TEAM_ID: "Team Outsiders"
      DEMO_MODE: "${DEMO_MODE:-true}"
      COOKIE_SECURE: "false"
    volumes:
      - notes:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped
volumes:
  notes:
