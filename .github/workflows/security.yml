name: NoteVault security and release
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact, hash-verified Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
          npm ci --prefix frontend
      - name: Functional and security regression tests
        run: |
          mkdir -p evidence
          .venv/bin/python -m pytest -q tests --junitxml=evidence/regression.xml
          npm run test --prefix frontend
          npm run build --prefix frontend
      - name: SAST - reject HIGH findings with MEDIUM or HIGH confidence
        run: .venv/bin/bandit -r backend -lll -ii -f json -o evidence/sast.json
      - name: SCA - reject any known Python issue and HIGH npm issues
        run: |
          .venv/bin/pip-audit -r requirements.txt --require-hashes --disable-pip -f json -o evidence/sca-python.json
          npm audit --prefix frontend --audit-level=high --json > evidence/sca-npm.json
      - name: Secret scanning of repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
      - name: Prove high severity gate rejection
        run: .venv/bin/python scripts/prove_gate.py
      - name: Build the hardened non-root container
        run: docker compose build
      - name: Container vulnerability gate
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: team-outsiders-app:latest
          format: json
          output: evidence/sca-container.json
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: false
      - name: Container smoke test
        run: |
          docker compose up -d --wait
          .venv/bin/python scripts/container_check.py
          docker compose down
      - name: Generate CycloneDX SBOMs and release package
        run: |
          ./scripts/sbom.sh
          .venv/bin/python scripts/package_release.py
      - name: Keep actual test and scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-evidence
          path: evidence/
      - name: Keep unsigned release for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release
          path: release/
  signed-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v3.1.3
      - name: Build and sign tagged release
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/security.yml@${{ github.ref }}
        run: |
          python -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
          npm ci --prefix frontend
          npm run build --prefix frontend
          ./scripts/sbom.sh
          .venv/bin/python scripts/package_release.py
          ARTIFACT=$(find release -name '*.tar.gz' -maxdepth 1)
          cosign sign-blob --yes --bundle release/release.sigstore.json "$ARTIFACT"
          cosign verify-blob --bundle release/release.sigstore.json --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$ARTIFACT" 2>&1 | tee release/verification.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: release/
